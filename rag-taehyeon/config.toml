# rag 패키지 설정. 환경변수가 있으면 환경변수가 먼저예요 (HRDB_URL, RAG_CHUNKS, RAG_EMBED_MODEL, GOLDENSET_DIR).

[data]
# 조각을 읽는 곳: DB(HRDB_URL이 있을 때) → chunks 파일 순서로 찾아요.
chunks = []                    # 예: ["../DB/data/regs/chunks.jsonl", "../DB/data/laws/chunks.jsonl"]
doc_kinds = []                 # 비우면 전부. 예: ["내부규정"] 이면 법령을 빼고 검색
cache_dir = ".rag_cache"       # 형태소 분석 결과를 저장해 두는 폴더

[embed]
model = "BAAI/bge-m3"
enabled = true                 # false면 모델을 안 불러오고 BM25만 써요
backend = "auto"               # auto: FlagEmbedding이 있으면 그걸로(ColBERT 가능), 없으면 sentence-transformers
max_len = 1024                 # 모델에 넣는 최대 토큰 수 (DB 임베딩을 만들 때와 같은 값)
batch_size = 16

[search]
preset = "C"                   # A0(Dense만) / A1(+BM25, RRF) / B(+하드 필터) / C(+적응형 필터·fallback)
n_candidates = 50              # 검색기마다 뽑는 후보 수
n_final = 20                   # 조항 단위로 합친 뒤 남기는 후보 수
top_k = 8                      # LLM에 넘기는 조각 수
rrf_k = 60
min_filtered = 3               # 하드 필터 뒤 후보가 이보다 적으면 필터를 풀어요
soft_boost = 0.3               # 소프트 필터: 카테고리가 겹치는 조각의 점수를 올리는 비율
internal_boost = 0.15          # 내부규정을 법령보다 조금 앞에 두는 비율 (0이면 끔)

[rerank]
mode = "none"                  # none / colbert(BGE-M3 ColBERT, FlagEmbedding 필요) / cross(크로스 인코더)
model = "BAAI/bge-reranker-v2-m3"   # mode = "cross" 일 때 쓰는 모델
pool = 20                      # 재정렬할 후보 수
dense_weight = 0.0             # 0이면 재정렬 점수만, 0.5면 Dense 코사인과 반반 섞음

[threshold]
# 아래 세 값은 BGE-M3 실제 점수로 dev 문항에서 다시 맞춰야 해요 (python -m rag --calibrate).
answer = 0.45                  # 1등 코사인이 이보다 낮으면 근거 없음으로 봐요
in_scope = 0.40                # 키워드가 없을 때, 대표 질문과의 유사도가 이보다 낮으면 범위 밖
high_conf = 0.55               # 대표 질문 유사도가 이 이상이면 분류를 믿어요
proto_margin = 0.03
