[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuri-rag"
version = "0.1.0"
description = "누리철도 HR 챗봇 규정 검색 (RAG)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
full = ["kiwipiepy>=0.18", "psycopg[binary]>=3.1", "sentence-transformers>=3.0"]

[tool.setuptools]
packages = ["rag"]
